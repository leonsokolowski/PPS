<ion-content fullscreen="true">
  <div class="login-container">
    <div class="form-card">
      <div class="header">
        <div class="logo">
          <ion-icon name="lock-closed-outline"></ion-icon>
        </div>
        <h2>Iniciar Sesión</h2>
      </div>

      <div class="form-container">
        <form [formGroup]="loginForm" (ngSubmit)="login()">
          <div class="form-field">
            <ion-label>Email</ion-label>
            <ion-item lines="none">
              <ion-icon name="mail-outline" slot="start"></ion-icon>
              <ion-input type="email" formControlName="email" inputmode="email"></ion-input>
            </ion-item>
            <div class="error-message" *ngIf="emailControl?.invalid && emailControl?.touched">
              <span *ngIf="emailControl?.errors?.['required']">El correo electrónico es obligatorio.</span>
              <span *ngIf="emailControl?.errors?.['email']">Ingrese un correo válido.</span>
            </div>
          </div>

          <div class="form-field">
            <ion-label>Contraseña</ion-label>
            <ion-item lines="none">
              <ion-icon name="key-outline" slot="start"></ion-icon>
              <ion-input type="password" formControlName="password"></ion-input>
            </ion-item>
            <div class="error-message" *ngIf="passwordControl?.invalid && passwordControl?.touched">
              <span *ngIf="passwordControl?.errors?.['required']">La contraseña es obligatoria.</span>
              <span *ngIf="passwordControl?.errors?.['minlength']">Debe tener al menos 6 caracteres.</span>
              <span *ngIf="passwordControl?.errors?.['pattern']">Debe contener una mayúscula y un número.</span>
            </div>
          </div>

          <div class="auth-error" *ngIf="authError">
            <ion-icon name="alert-circle-outline"></ion-icon>
            <ion-text>{{ authError }}</ion-text>
          </div>

          <!-- Botón visible solo en vertical -->
          <div class="buttons-container login-button-container inside-card">
            <ion-button type="submit" expand="block" [disabled]="isSubmitting" class="login-button">
              <span class="login-text">Iniciar Sesión</span>
              <ion-icon name="arrow-forward-outline"></ion-icon>
            </ion-button>
          </div>
        </form>
      </div>
    </div>

    <div class="quick-actions">
      <div class="quick-access-buttons">
        <ion-button size="small" fill="solid" (click)="quickAccess(1)">
          <ion-icon name="flash-outline" slot="start"></ion-icon>
          A1
        </ion-button>
        <ion-button size="small" fill="solid" (click)="quickAccess(2)">
          <ion-icon name="flash-outline" slot="start"></ion-icon>
          A2
        </ion-button>
        <ion-button size="small" fill="solid" (click)="quickAccess(3)">
          <ion-icon name="flash-outline" slot="start"></ion-icon>
          A3
        </ion-button>
      </div>

      <ion-button fill="clear" (click)="resetForm()" class="reset-button">
        <ion-icon name="trash-outline" size="large"></ion-icon>
        <span class="reset-text">Limpiar campos</span>
      </ion-button>

      <!-- Botón visible solo en horizontal -->
      <ion-button expand="block" [disabled]="isSubmitting" (click)="login()" class="login-button outside-card">
        <span class="login-text">Iniciar Sesión</span>
        <ion-icon name="arrow-forward-outline"></ion-icon>
      </ion-button>
    </div>
  </div>
</ion-content>
