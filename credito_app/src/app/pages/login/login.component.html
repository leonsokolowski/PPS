<!-- Tu HTML actual está perfecto, solo asegúrate de que tenga exactamente esto: -->

<ion-content [fullscreen]="true" class="login-content">
  <img src="assets/splash/fondo.png" class="fondo" />
  <div class="login-container">
    <div class="login-box">
      <h2 class="login-title">Ingreso a Crédito App</h2>

      <form [formGroup]="loginForm" (ngSubmit)="login()" class="login-form">
        <ion-item lines="none">
          <ion-label position="stacked">Correo electrónico</ion-label>
          <ion-input type="email" formControlName="email" [(ngModel)]="admin_email"></ion-input>
        </ion-item>
        <div class="error-message" *ngIf="loginForm.get('email')?.invalid && loginForm.get('email')?.touched">
            <span *ngIf="loginForm.get('email')?.errors?.['required']">El correo es requerido</span>
            <span *ngIf="loginForm.get('email')?.errors?.['email']">Ingrese un correo válido</span>
        </div>

        <ion-item lines="none">
          <ion-label position="stacked">Contraseña</ion-label>
          <ion-input type="password" formControlName="password" [(ngModel)]="admin_password"></ion-input>
        </ion-item>
        <div class="error-message" *ngIf="loginForm.get('password')?.invalid && loginForm.get('password')?.touched">
            <span *ngIf="passwordControl?.errors?.['required']">La contraseña es obligatoria.</span>
            <span *ngIf="passwordControl?.errors?.['minlength']">Debe tener al menos 6 caracteres.</span>
            <span *ngIf="passwordControl?.errors?.['pattern']">Debe contener una mayúscula y un número.</span>
        </div>

         <div class="error-msg" *ngIf="errorMessage">
            {{ errorMessage }}
          </div>

        <ion-button expand="block" class="login-btn" type="submit">
          Iniciar Sesión
        </ion-button>
      </form>
      
      <div class="accesos" style="color: green;">
        <p>Accesos rápidos:</p>
        <div class="btn-accesos">
          <ion-button size="small" fill="outline" (click)="accesoRapido(1)">Admin 1</ion-button>
          <ion-button size="small" fill="outline" (click)="accesoRapido(2)">Admin 2</ion-button>
          <ion-button size="small" fill="outline" (click)="accesoRapido(3)">Admin 3</ion-button>
          <ion-button class="delete-button" (click)="resetForm()">Limpiar campos</ion-button>
        </div>
      </div>
    </div>
  </div>
</ion-content>

<!-- 
NOTA: Solo cambié (click)="login()" por (ngSubmit)="login()" en el form para mejor práctica,
pero si prefieres dejarlo como estaba también funcionará.
-->
